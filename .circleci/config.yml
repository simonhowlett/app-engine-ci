version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -r test-requirements.txt
      - run:
          name: Run test suite
          command: |
            . .venv/bin/activate
            pytest test/ test/test_form_security.py -q --maxfail=1

workflows:
  version: 2
  default:
    jobs:
      - build-and-test
